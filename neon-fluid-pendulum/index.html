<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Fluid Pendulum - Interactive Physics Toy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: #fff;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 20, 0.8);
            padding: 20px;
            border: 2px solid #00ffff;
            border-radius: 0;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(0, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 100;
            max-width: 300px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls h2 {
            color: #00ffff;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #00ffff;
            font-size: 16px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #ff00ff;
            text-shadow: 0 0 5px rgba(255, 0, 255, 0.5);
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(255, 0, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 2px;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #ff00ff;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff00ff;
        }

        .control-group input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #ff00ff;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff00ff;
            border: none;
        }

        .control-group select {
            width: 100%;
            padding: 8px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            color: #fff;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            cursor: pointer;
            outline: none;
        }

        .control-group select:focus {
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .value-display {
            color: #ffff00;
            text-shadow: 0 0 5px rgba(255, 255, 0, 0.5);
            float: right;
            font-weight: bold;
        }

        .btn {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: transparent;
            border: 1px solid #00ffff;
            color: #00ffff;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .btn:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            text-shadow: 0 0 10px #00ffff;
        }

        .btn-reset {
            border-color: #ff0055;
            color: #ff0055;
        }

        .btn-reset:hover {
            background: rgba(255, 0, 85, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            text-shadow: 0 0 10px #ff0055;
        }

        .instructions {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 10, 20, 0.8);
            padding: 15px;
            border: 2px solid #ff00ff;
            border-radius: 0;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
            max-width: 280px;
            font-size: 11px;
            color: #ccc;
            backdrop-filter: blur(10px);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .instructions strong {
            color: #ff00ff;
            text-shadow: 0 0 5px rgba(255, 0, 255, 0.5);
        }

        .fps {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #00ff00;
            font-size: 12px;
            text-shadow: 0 0 5px #00ff00;
            font-family: 'Courier New', monospace;
        }

        @media (max-width: 768px) {
            .controls {
                transform: scale(0.8);
                left: 10px;
                top: 10px;
            }
            .instructions {
                transform: scale(0.8);
                right: 10px;
                bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="controls">
        <h2>⚡ NEON FLUID PENDULUM</h2>

        <div class="control-group">
            <label>Orb Count: <span class="value-display" id="countValue">8</span></label>
            <input type="range" id="orbCount" min="3" max="20" value="8" step="1">
        </div>

        <div class="control-group">
            <label>Gravity: <span class="value-display" id="gravityValue">0.5</span></label>
            <input type="range" id="gravity" min="0.1" max="1.5" value="0.5" step="0.1">
        </div>

        <div class="control-group">
            <label>Damping: <span class="value-display" id="dampingValue">0.995</span></label>
            <input type="range" id="damping" min="0.95" max="1.0" value="0.995" step="0.005">
        </div>

        <div class="control-group">
            <label>Trail Length: <span class="value-display" id="trailValue">25</span></label>
            <input type="range" id="trailLength" min="10" max="100" value="25" step="5">
        </div>

        <div class="control-group">
            <label>Neon Color Scheme:</label>
            <select id="colorScheme">
                <option value="cyber">Cyberpunk</option>
                <option value="rainbow">Rainbow Flux</option>
                <option value="sunset">Neon Sunset</option>
                <option value="matrix">Matrix Pulse</option>
                <option value="arctic">Arctic Glow</option>
            </select>
        </div>

        <div class="control-group">
            <label>Mouse Mode:</label>
            <select id="mouseMode">
                <option value="attract">Attract</option>
                <option value="repel">Repel</option>
                <option value="vortex">Vortex</option>
                <option value="none">None</option>
            </select>
        </div>

        <button class="btn btn-reset" id="resetBtn">RESET SIMULATION</button>
        <button class="btn" id="pauseBtn">PAUSE / RESUME</button>
    </div>

    <div class="instructions">
        <strong>HOW TO PLAY</strong><br><br>
        • Click & drag to fling orbs<br>
        • Orbs swing like pendulums<br>
        • Mouse interaction affects motion<br>
        • Each orb leaves a glowing trail<br>
        • Watch the fluid neon patterns<br><br>
        <em>Try different color schemes!</em>
    </div>

    <div class="fps" id="fps">FPS: 60</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Configuration
        let config = {
            orbCount: 8,
            gravity: 0.5,
            damping: 0.995,
            trailLength: 25,
            colorScheme: 'cyber',
            mouseMode: 'attract',
            paused: false
        };

        // Color schemes
        const colorSchemes = {
            cyber: ['#00ffff', '#ff00ff', '#ffff00', '#00ff00', '#ff0055'],
            rainbow: ['#ff0000', '#ff8800', '#ffff00', '#00ff00', '#0088ff', '#8800ff'],
            sunset: ['#ff6b6b', '#feca57', '#ff9ff3', '#ff6348', '#ff4757'],
            matrix: ['#00ff00', '#00cc00', '#009900', '#00ff00', '#33ff33'],
            arctic: ['#00d2d3', '#54a0ff', '#5f27cd', '#00d2d3', '#48dbfb']
        };

        // Resize canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Orb class
        class Orb {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.radius = 12 + Math.random() * 15;
                this.color = this.getColor();
                this.trail = [];
                this.pivot = { x: x, y: y - 200 - Math.random() * 300 };
                this.angle = Math.PI / 2 + (Math.random() - 0.5) * 0.5;
                this.angleVel = 0;
                this.length = 100 + Math.random() * 200;
                this.oscillation = Math.random() * Math.PI * 2;
            }

            getColor() {
                const scheme = colorSchemes[config.colorScheme];
                return scheme[Math.floor(Math.random() * scheme.length)];
            }

            update() {
                if (config.paused) return;

                // Pendulum physics
                const dx = this.x - this.pivot.x;
                const dy = this.y - this.pivot.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // Constrain to pendulum length
                if (dist > this.length) {
                    const ratio = this.length / dist;
                    this.x = this.pivot.x + dx * ratio;
                    this.y = this.pivot.y + dy * ratio;
                }

                // Pendulum angle
                const angle = Math.atan2(this.x - this.pivot.x, this.y - this.pivot.y);
                const gravityForce = config.gravity * Math.sin(angle);
                this.angleVel += gravityForce * 0.01;
                this.angleVel *= config.damping;

                this.angle += this.angleVel;

                // Update position based on angle
                this.x = this.pivot.x + Math.sin(this.angle) * this.length;
                this.y = this.pivot.y + Math.cos(this.angle) * this.length;

                // Add slight oscillation
                this.oscillation += 0.02;
                this.x += Math.sin(this.oscillation) * 5;
                this.y += Math.cos(this.oscillation) * 3;

                // Update trail
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > config.trailLength) {
                    this.trail.shift();
                }

                // Mouse interaction
                if (mouse.active && config.mouseMode !== 'none') {
                    const mdx = mouse.x - this.x;
                    const mdy = mouse.y - this.y;
                    const mdist = Math.sqrt(mdx * mdx + mdy * mdy);

                    if (mdist < 300) {
                        const force = (300 - mdist) / 300;
                        let fx, fy;

                        switch(config.mouseMode) {
                            case 'attract':
                                fx = mdx * force * 0.5;
                                fy = mdy * force * 0.5;
                                break;
                            case 'repel':
                                fx = -mdx * force * 0.8;
                                fy = -mdy * force * 0.8;
                                break;
                            case 'vortex':
                                fx = -mdy * force * 0.8;
                                fy = mdx * force * 0.8;
                                break;
                        }

                        this.x += fx;
                        this.y += fy;
                        this.angleVel += (Math.random() - 0.5) * force * 0.2;
                    }
                }
            }

            draw() {
                // Draw trail
                for (let i = 0; i < this.trail.length; i++) {
                    const point = this.trail[i];
                    const alpha = (i / this.trail.length) * 0.6;
                    const size = (i / this.trail.length) * this.radius * 0.8;

                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Draw main orb
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 25;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Inner highlight
                ctx.globalAlpha = 0.7;
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 5;
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Draw pendulum string
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(this.pivot.x, this.pivot.y);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
                ctx.restore();
            }
        }

        // Initialize orbs
        let orbs = [];
        function initOrbs() {
            orbs = [];
            for (let i = 0; i < config.orbCount; i++) {
                const angle = (i / config.orbCount) * Math.PI * 2;
                const radius = 50 + Math.random() * 100;
                const x = canvas.width / 2 + Math.cos(angle) * radius;
                const y = canvas.height / 2 + Math.sin(angle) * radius;
                orbs.push(new Orb(x, y));
            }
        }
        initOrbs();

        // Mouse tracking
        const mouse = {
            x: 0,
            y: 0,
            active: false
        };

        canvas.addEventListener('mousedown', (e) => {
            mouse.active = true;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        canvas.addEventListener('mouseup', () => {
            mouse.active = false;
        });

        canvas.addEventListener('mouseleave', () => {
            mouse.active = false;
        });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            mouse.active = true;
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', () => {
            mouse.active = false;
        });

        // UI Controls
        document.getElementById('orbCount').addEventListener('input', (e) => {
            config.orbCount = parseInt(e.target.value);
            document.getElementById('countValue').textContent = config.orbCount;
            initOrbs();
        });

        document.getElementById('gravity').addEventListener('input', (e) => {
            config.gravity = parseFloat(e.target.value);
            document.getElementById('gravityValue').textContent = config.gravity;
        });

        document.getElementById('damping').addEventListener('input', (e) => {
            config.damping = parseFloat(e.target.value);
            document.getElementById('dampingValue').textContent = config.damping;
        });

        document.getElementById('trailLength').addEventListener('input', (e) => {
            config.trailLength = parseInt(e.target.value);
            document.getElementById('trailValue').textContent = config.trailLength;
        });

        document.getElementById('colorScheme').addEventListener('change', (e) => {
            config.colorScheme = e.target.value;
            orbs.forEach(orb => orb.color = orb.getColor());
        });

        document.getElementById('mouseMode').addEventListener('change', (e) => {
            config.mouseMode = e.target.value;
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            initOrbs();
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            config.paused = !config.paused;
        });

        // Background particles
        const particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speedX: (Math.random() - 0.5) * 0.5,
                speedY: (Math.random() - 0.5) * 0.5
            });
        }

        // FPS counter
        let fps = 60;
        let frameCount = 0;
        let lastTime = performance.now();

        function updateFPS() {
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = now;
                document.getElementById('fps').textContent = `FPS: ${fps}`;
            }
        }

        // Animation loop
        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw background particles
            ctx.save();
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            // Draw orbs
            orbs.forEach(orb => {
                orb.update();
                orb.draw();
            });

            // Draw mouse interaction circle
            if (mouse.active && config.mouseMode !== 'none') {
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 50, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 300, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            updateFPS();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
